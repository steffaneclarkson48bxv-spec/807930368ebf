          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flake_eval -j2
      - run:
          name: Evaluate flake outputs
          command: LIONSS_LP=1 ./build/flake_eval --flake flake.nix --system x86_64-linux

